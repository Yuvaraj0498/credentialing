# ============================================================
# SERVER settings (desssnext.desss-portfolio.com).
# Spring Boot reads ./config/application.properties automatically, so start the API from the backend folder:
#   cd backend && java -jar target/credentialing-0.0.1-SNAPSHOT.jar
# These values override the defaults packaged in src/main/resources/application.properties.
# This file holds secrets: keep it on the server only (it is git-ignored).
# ============================================================

# API port (Apache proxies /api -> 127.0.0.1:8085)
server.port=9090

# Database. createDatabaseIfNotExist creates "credentialing" on the first start;
# Flyway then creates all tables and loads the demo data.
spring.datasource.url=jdbc:mysql://localhost:3306/zmartcredential?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=admin
spring.datasource.password=H0u$t0n77042

# Schema + reference data + demo data (demo logins admin/admin123, clerk/clerk123, platform.admin/test123 ...).
# To run without demo data on a NEW database use: classpath:db/migration
spring.flyway.locations=classpath:db/migration

# Security keys (random, generated for this server).
# NEVER change app.encryption-key after first start: stored payer/CAQH passwords would become unreadable.
app.jwt.secret=<new value from: openssl rand -base64 48>
app.encryption-key=<new value from: openssl rand -base64 48>

# The admin app's public origin (browser address) and HTTPS-only refresh cookie
app.cors.allowed-origins=https://credentialingsjs.desss-portfolio.com
app.cookie-secure=true

# Uploaded documents (relative to the backend folder)
app.storage.path=./uploads

# ---------- Email (SMTP) ----------
# Public site address used for the links inside emails
app.public-url=https://credentialingsjs.desss-portfolio.com
# Real email is ON (IONOS). Set to false to only write emails to the email log.
app.mail.enabled=true
app.mail.from=karthikeyan@desss.com
app.mail.from-name=ZmartCredential
spring.mail.host=smtp.ionos.com
spring.mail.port=587
spring.mail.username=karthikeyan@desss.com
spring.mail.password=Kitkat@2725
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=false
