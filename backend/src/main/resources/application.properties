spring.application.name=credentialing
server.port=${SERVER_PORT:8080}

# ---------- Database (XAMPP MySQL/MariaDB locally) ----------
# Change DB_NAME / DB_URL to point at another database; nothing else needs to change.
app.db-name=${DB_NAME:credentialing}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/${app.db-name}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Flyway owns the schema; Hibernate never alters it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
# Demo/seed data (prototype sample records) lives in db/demo. For production set FLYWAY_LOCATIONS=classpath:db/migration

spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/demo}

# ---------- Security ----------
# Secrets are arbitrary strings (hashed to 256-bit keys). Local defaults are for development only — always override in production.
app.jwt.secret=${JWT_SECRET:dev-only-jwt-secret-change-me-in-production}
app.jwt.access-token-minutes=${JWT_ACCESS_MINUTES:30}
app.jwt.refresh-token-days=${JWT_REFRESH_DAYS:14}
app.encryption-key=${APP_ENCRYPTION_KEY:dev-only-encryption-key-change-me}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
# Set true in production (HTTPS) so the refresh-token cookie is only sent over TLS.
app.cookie-secure=${COOKIE_SECURE:false}

# ---------- File storage ----------
app.storage.path=${STORAGE_PATH:./uploads}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=100MB

# ---------- API docs ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---------- Email (SMTP) ----------
# Off by default: emails are only written to the email log. Set MAIL_ENABLED=true plus the SMTP settings
# (or the same keys in config/application.properties on the server) to send real mail.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:}
app.mail.from-name=${MAIL_FROM_NAME:ZmartCredential}
# Public address of the site, used to build links in emails (no trailing slash, without /admin)
app.public-url=${PUBLIC_URL:http://localhost:3000}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:false}
# A server that accepts the connection and then goes quiet must not hold the request for minutes
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ---------- Payer portal auto-login (Payer Submissions → Submit) ----------
# A headless Chrome on the server signs in to the payer portal with the stored login and reports what the portal shows.
# Needs Chrome/Chromium on the server (blank binary = auto-detect, or Selenium downloads one).
app.portal-login.enabled=${PORTAL_LOGIN_ENABLED:true}
app.portal-login.chrome-binary=${PORTAL_LOGIN_CHROME:}
# Testing only: allow portal URLs on localhost / private networks
app.portal-login.allow-private-hosts=${PORTAL_LOGIN_ALLOW_PRIVATE:false}
app.portal-login.timeout-seconds=${PORTAL_LOGIN_TIMEOUT:60}
