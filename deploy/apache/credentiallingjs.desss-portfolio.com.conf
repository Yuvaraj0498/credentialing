<VirtualHost *:443>
    ServerName credentiallingjs.desss-portfolio.com
    ServerAlias www.credentiallingjs.desss-portfolio.com
    ServerAdmin webmaster@credentiallingjs.desss-portfolio.com
    DocumentRoot /var/www/Vhost/credentiallingjs.desss-portfolio.com

    # The project folder holds source code and backend/config (DB password, keys):
    # never serve it as files. Everything below is proxied to the running apps.
    <Directory /var/www/Vhost/credentiallingjs.desss-portfolio.com>
        Options -Indexes
        AllowOverride None
        Require all denied
    </Directory>

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"

    # API -> Spring Boot (port 8086)
    ProxyPass        /api  http://127.0.0.1:8086/api
    ProxyPassReverse /api  http://127.0.0.1:8086/api

    # Swagger UI + OpenAPI docs
    ProxyPass        /swagger-ui    http://127.0.0.1:8086/swagger-ui
    ProxyPassReverse /swagger-ui    http://127.0.0.1:8086/swagger-ui
    ProxyPass        /v3/api-docs   http://127.0.0.1:8086/v3/api-docs
    ProxyPassReverse /v3/api-docs   http://127.0.0.1:8086/v3/api-docs

    # Admin -> Next.js (port 3009, basePath /admin)
    ProxyPass        /admin  http://127.0.0.1:3009/admin
    ProxyPassReverse /admin  http://127.0.0.1:3009/admin

    # Site root and /signin -> admin sign-in
    RedirectMatch 302 ^/(signin/?)?$ /admin/signin

    ErrorLog ${APACHE_LOG_DIR}/credentiallingjs-error.log
    CustomLog ${APACHE_LOG_DIR}/credentiallingjs-access.log combined

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/desss-portfolio_ssl.cer
    SSLCertificateKeyFile /etc/apache2/ssl/dessport.key
    SSLCertificateChainFile /etc/apache2/ssl/intermediate1.cer
</VirtualHost>

# Plain HTTP -> HTTPS
<VirtualHost *:80>
    ServerName credentiallingjs.desss-portfolio.com
    ServerAlias www.credentiallingjs.desss-portfolio.com
    Redirect permanent / https://credentiallingjs.desss-portfolio.com/
</VirtualHost>