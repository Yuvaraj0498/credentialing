<VirtualHost *:80>
    ServerName credentialingsjs.desss-portfolio.com
    ServerAlias www.credentialingsjs.desss-portfolio.com
    ServerAdmin webmaster@credentialingsjs.desss-portfolio.com
    DocumentRoot /var/www/Vhost/credentialingsjs.desss-portfolio.com
    Redirect permanent / https://credentialingsjs.desss-portfolio.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName credentialingsjs.desss-portfolio.com
    ServerAlias www.credentialingsjs.desss-portfolio.com
    ServerAdmin webmaster@credentialingsjs.desss-portfolio.com
    DocumentRoot /var/www/Vhost/credentialingsjs.desss-portfolio.com

    # The project folder holds source code and backend/config (DB password, keys):
    # never serve it as files. Everything below is proxied to the running apps.
    <Directory /var/www/Vhost/credentialingsjs.desss-portfolio.com>
        Options -Indexes
        AllowOverride None
        Require all denied
    </Directory>

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"

    # API -> Spring Boot (port 9090)
    ProxyPass        /api  http://127.0.0.1:9090/api
    ProxyPassReverse /api  http://127.0.0.1:9090/api

    # Swagger UI + OpenAPI docs
    ProxyPass        /swagger-ui    http://127.0.0.1:9090/swagger-ui
    ProxyPassReverse /swagger-ui    http://127.0.0.1:9090/swagger-ui
    ProxyPass        /v3/api-docs   http://127.0.0.1:9090/v3/api-docs
    ProxyPassReverse /v3/api-docs   http://127.0.0.1:9090/v3/api-docs

    # Admin -> Next.js (port 3007, basePath /admin)
    ProxyPass        /admin  http://127.0.0.1:3007/admin
    ProxyPassReverse /admin  http://127.0.0.1:3007/admin

    # Site root and /signin -> admin sign-in
    RedirectMatch 302 ^/(signin/?)?$ /admin/signin

    ErrorLog ${APACHE_LOG_DIR}/credentialingsjs_error.log
    CustomLog ${APACHE_LOG_DIR}/credentialingsjs_access.log combined

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/desss-portfolio_ssl.cer
    SSLCertificateKeyFile /etc/apache2/ssl/dessport.key
    SSLCertificateChainFile /etc/apache2/ssl/intermediate1.cer
</VirtualHost>
